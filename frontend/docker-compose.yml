version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: codeforge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: codeforge_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/codeforge?schema=public
      - JWT_SECRET=super_secret_codeforge_key_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: codeforge_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
